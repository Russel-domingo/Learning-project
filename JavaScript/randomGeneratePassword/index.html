<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    
    <div id="container">
        <form>
            <h1>Password Generator</h1>
            <label>Password Length: </label>
            <input type="number" id="passwordLength"value="1" min='1'><br>
            <input type="radio" id="lowerCase">
            <label for="lowerCase">Include Lower Case?</label><br>
            <input type="radio" id="upperCase">
            <label for="upperCase">Include Upper Case?</label><br>
            <input type="radio" id="numbers">
            <label for="numbers">Include Numbers?</label><br>
            <input type="radio" id="symbols">
            <label for="symbols">Include Symbols?</label><br>
            <button type="button" onclick="generatePassword()">Generate Password</button>
        </form>
        <p id="result"></p>
    </div>

    <script src="main.js"> </script>
</body>
</html>
