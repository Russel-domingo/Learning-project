<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <form>
        <h1>Temperature Conversion</h1>
        <input type="number" id="input" value="0"><br>

        <input type="radio" id="fahrenheit" name="conversion">
        <label for="fahrenheit">Celcius ➡️ Fahrenheit</label><br>
        <input type="radio" id="celcius" name="conversion">
        <label for="celcius">Fahrenheit ➡️ Celcius</label><br>

        <button type="button" onclick="convert()">Convert</button>
        <p id="result"></p>
    </form>

    <script src="main.js"></script>
</body>
</html>
