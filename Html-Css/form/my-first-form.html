<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My test Page</title>
</head>
<body>
    <p>This is my page</p>
    <form action="#">
        <h1>Payment form</h1>
        <p>PLease complete all required (*) Fields</p>

        <section>
            <h2>Contact Number</h2>
            <fieldset>
                <legend>Title</legend>
                <ul>
                    <li>
                        <label for="title_1">
                            <input type="radio" name="title" id="title_1" value="A">
                            Ace
                        </label>
                    </li>
                    <li>
                        <label for="title_2">
                            <input type="radio" name="title" id="title_2">
                            King
                        </label>
                    </li>
                    <li>
                        <label for="title_2">
                            <input type="radio" name="title" id="title_3">
                            Queen
                        </label>
                    </li>
                </ul>
            </fieldset>

            <p>
                <label for="name">Name *</label>
                <input type="text" name="user_name" id="name" required>
            </p>
            <p>
                <label for="mail">Email *</label>
                <input type="email" name="user_email" id="mail" required\>
            </p>
            <p>
                <label for="pwd">Password</label>
                <input type="password" name="password" id="pwd" required>
            </p>
        </section>

        <section>
            <h2>Payment Method</h2>
            <p>
                <label for="card">
                    <span>Card Type</span>
                </label>
                <select name="user_card" id="card">
                    <option value="visa">Visa</option>
                    <option value="mc">MasterCard</option>
                    <option value="amex">American Express</option>
                </select>
            </p>

            <p>
                <label for="number">Card number *:</label>
                <input type="tel" name="card_number" id="number" required>
            </p>

            <p>
                <label for="expiration">Expiration data *: </label>
                <input type="text" name="expiration" id="expiration" required placeholder="MM/YY" pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$">
            </p>
        </section>

        <section>
            <p>
                <button type="submit">Validate the payment</button>
            </p>
        </section>
    </form>
</body>
</html>
