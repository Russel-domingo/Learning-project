<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Card</title>
    <style>
        @font-face {
            font-family: "handwriting";
            src: url("font/webfontkit-20251019-053436/journal-webfont.woff2") format("woff2"),
                url("font/webfontkit-20251019-053436/journal-webfont.woff") format("woff");
        
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: "typewriter";
            src: url("font/webfontkit-20251019-053436/momt___-webfont.woff2") format("woff2"),
                url("font/webfontkit-20251019-053436/momt___-webfont.woff") format("woff");

            font-weight: normal;
            font-style: normal;
        }

        body {
            font: 1.3rem sans-serif;
            padding: 0.5em;
            margin: 0;
            background: #222222;
        }

        form {
            position: relative;
            width: 740px;
            height: 498px;
            margin: 0 auto;
            padding: 1em;
            box-sizing: border-box;
            background: white url(background.jpg);
            
            display: grid;
            grid-gap: 20px;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: 10em 1em 1em 1em;
        }

        h1 {
            font: 1em "typewriter", monospace;
            align-self: end;
        }

        #message {
            grid-row: 1/5;
        }

        #from,
        #reply {
            display: flex;
        }

        label {
            font: 0.8em "typewriter", sans-serif;
        }

        input,
        textarea {
            font: 1.4em/1.5em "handwriting", cursive, sans-serif;
            border: none;
            padding: 0 10px;
            margin: 0;
            width: 80%;
            background: none;
        }

        input:focus,
        textarea:focus {
            background: rgb(0 0 0 / 10%);
            border-radius: 5px;
        }

        textarea {
            display: block;
            padding: 10px;
            margin: 10px 0 0 -10px;
            width: 100%;
            height: 90%;

            border-right: 1px solid;

            overflow: auto;
        }

        button {
            padding: 5px;
            font: bold 0.6em sans-serif;
            border: 2px solid #333333;
            border-radius: 5px;
            background: none;
            cursor: pointer;
            transform: rotate(-1.5deg);
        }

        button::after {
            content:  " >>>";
        }

        button:hover,
        button:focus {
            background: black;
            color: white;
        }
    </style>
</head>
<body>
    <form action="">
        <h1>To: Mozilla</h1>
        
        <div id="from">
            <label for="name">From:</label>
            <input type="text" name="user_name" id="name">
        </div>

        <div id="reply">
            <label for="msg">Your message</label>
            <textarea name="user_message" id="msg"></textarea>
        </div>

        <div class="button">
            <button type="submit">Send Your message</button>
        </div>
    </form>
</body>
</html>
